services:
  # @spec GATE-008, GATE-009
  redis:
    image: redis:7-alpine
    container_name: litellm-redis
    restart: always
    # Save every 60s if >=1 key changed. Cap memory at 1.5GB with LRU eviction.
    command: redis-server --save 60 1 --maxmemory 1536mb --maxmemory-policy allkeys-lru
    volumes:
      - ./redis-data:/data

  headroom:
    image: python:3.12-slim
    container_name: headroom-proxy
    restart: always
    # Pinned to a specific version to prevent PyPI drift on restart
    command: >
      sh -c "pip install headroom-ai[proxy]==0.37.0 && headroom proxy --host 0.0.0.0 --port 8787 --mode cache"
    environment:
      - HEADROOM_TELEMETRY=off
      - HEADROOM_COMPRESS_USER_MESSAGES=1

  # @spec GATE-012, GATE-013, GATE-014
  embedding:
    image: ollama/ollama:latest
    container_name: embedding-sidecar
    restart: always
    environment:
      - OLLAMA_HOST=0.0.0.0
    # Boots the server in the background, waits, pulls the model, and keeps the container alive
    entrypoint: >
      sh -c "ollama serve & sleep 5 && ollama pull nomic-embed-text && wait"
    volumes:
      - ./embedding-cache:/root/.ollama

  # @spec KEYS-001, KEYS-002
  postgres:
    image: postgres:16-alpine
    container_name: litellm-postgres
    restart: always
    environment:
      - POSTGRES_DB=litellm
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  # @spec GATE-010, KEYS-003, KEYS-004
  litellm:
    image: litellm/litellm:v1.99.1
    container_name: litellm-proxy
    restart: always
    ports:
      - "4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - REDIS_HOST=redis
      # Empty, not omitted: LiteLLM's redis-semantic backend requires this env var to
      # exist even when Redis has no auth configured (KeyError -> boot crash otherwise).
      - REDIS_PASSWORD=
      - DATABASE_URL=postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
    command: [ "--config", "/app/config.yaml", "--port", "4000" ]
    depends_on:
      - redis
      - headroom
      - embedding
      - postgres
