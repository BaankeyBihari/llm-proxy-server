[project]
name = "llm-proxy-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "boto3>=1.34",
]

[tool.uv]
package = false
# mise owns the interpreter (see .mise.toml) — never let uv fetch its own.
python-preference = "only-system"
